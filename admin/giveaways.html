<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="ag-site-url" content="http://localhost:8000">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Giveaways</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../styles.css?v=479" />
</head>
<body class="admin-body admin-body--giveaway">
  <div class="admin-wrap">
    <header class="admin-header">
      <div class="admin-header-title">
        <div class="admin-header-icon">🎁</div>
        <div>
          <h1>Giveaway Admin</h1>
          <div class="admin-header-sub">Create, phase-control, review and draw winners — all in one place.</div>
        </div>
      </div>
      <div id="gw-auth-debug-admin"></div>
    </header>

    <main class="admin-main">
      <section id="gw-admin-section" class="gw-admin-section gw-event-section">
        <div id="gw-admin-create-card" class="gw-form-card gw-event-card" style="margin-bottom: 24px">
          <div class="gw-form-head">
            <div class="gw-form-head-accent">⚙️</div>
            <div>
              <h2 class="section-title">Create &amp; Launch Giveaway</h2>
              <div class="gw-form-subtitle">Fill in the details below and it goes LIVE immediately — users can enter right away.</div>
            </div>
          </div>
          <div class="gw-admin-grid">
            <label class="gw-form-label">
              <span>Title</span>
              <input id="gw-create-title" class="gw-form-input" type="text" value="Deposit Giveaway" />
            </label>
            <label class="gw-form-label">
              <span>Prize</span>
              <input id="gw-create-prize" class="gw-form-input" type="text" value="$250 CASH" />
            </label>
            <label class="gw-form-label">
              <span>Winners Count</span>
              <input id="gw-create-winners" class="gw-form-input" type="number" min="1" max="10" value="1" />
            </label>
            <label class="gw-form-label">
              <span>Min Deposit Amount</span>
              <input id="gw-create-min" class="gw-form-input" type="number" min="1" value="20" />
            </label>
            <label class="gw-form-label">
              <span>Min Deposit Currency</span>
              <input id="gw-create-cur" class="gw-form-input" type="text" value="USD / EUR" />
            </label>
            <label class="gw-form-label">
              <span>Subtitle (optional)</span>
              <input id="gw-create-sub" class="gw-form-input" type="text" value="Deposit at any of our casinos and submit proof." />
            </label>
          </div>
          <div class="gw-form-actions gw-admin-create-actions">
            <button type="button" id="gw-create-btn" class="promoBtn gw-admin-primary">🚀 Create &amp; Start LIVE Now</button>
            <button type="button" id="gw-reset-btn" class="promoBtn gw-admin-reset">Reset Active</button>
          </div>
        </div>

        <div id="gw-phase-controls" class="gw-phase-controls"></div>

        <div class="gw-pending-card gw-event-card">
          <div class="giveaway-panel-head">
            <h2 class="section-title">⏳ Pending Review <span id="gw-pending-head-count">(0)</span></h2>
          </div>
          <div id="gw-pending-list" class="gw-entry-list">
            <div class="agp-empty">No pending entries.</div>
          </div>
        </div>
      </section>

      <div id="gw-auth-debug"></div>
    </main>
  </div>

  <div id="login-modal" class="modal-overlay" style="display:none"></div>

  <script src="../app.js?v=479" defer></script>
  <script src="../giveaways/giveaways.js?v=479" defer></script>
</body>
</html>
