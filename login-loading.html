<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="ag-site-url" content="http://localhost:8000">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antongambles | Logging In</title>
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="theme-color" content="#070707" />
    <link rel="stylesheet" href="styles.css?v=495" />
    <script src="login-loading.js?v=493" defer></script>
  </head>
  <body class="auth-loading-page">
    <main class="auth-loading-shell">
      <section class="auth-loading-card" aria-live="polite">
        <div class="auth-loading-logo">
          <img src="assets/antonpng.png" alt="Antongambles" />
        </div>
        <div class="auth-loading-eyebrow">
          <span class="auth-loading-dot" aria-hidden="true"></span>
          Discord Auth
        </div>
        <h1 class="auth-loading-title">Logging In</h1>
        <p class="auth-loading-copy">
          We are connecting your Discord account and syncing your Coins profile. You will be redirected automatically.
        </p>
        <div id="auth-loading-status" class="auth-loading-status">Verifying your session...</div>
        <div id="auth-loading-substatus" class="auth-loading-substatus">This only takes a second.</div>
        <div class="auth-loading-dots" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div id="auth-loading-actions" class="auth-loading-actions">
          <a
            id="auth-loading-join-btn"
            class="auth-loading-action is-primary"
            href="https://discord.gg/t7hNWHX6GW"
            target="_blank"
            rel="noopener noreferrer"
          >
            Join Discord
          </a>
          <a id="auth-loading-back-btn" class="auth-loading-action" href="/">Back To Site</a>
        </div>
      </section>
    </main>
  </body>
</html>
